name: VargaMesh Desktop Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download VargaMesh Core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources/core | Out-Null
          gh release download v0.1.0 --repo ati1993de/vargamesh-core --pattern "VargaMesh-v0.1.0-windows-x86_64.zip" --dir "$env:RUNNER_TEMP"
          Expand-Archive "$env:RUNNER_TEMP/VargaMesh-v0.1.0-windows-x86_64.zip" "$env:RUNNER_TEMP/vmesh-core" -Force
          $daemon = Get-ChildItem "$env:RUNNER_TEMP/vmesh-core" -Recurse -Filter vargameshd.exe | Select-Object -First 1
          $cli = Get-ChildItem "$env:RUNNER_TEMP/vmesh-core" -Recurse -Filter vargamesh-cli.exe | Select-Object -First 1
          if (!$daemon -or !$cli) { throw "Core binaries missing" }
          if ($daemon.DirectoryName -ne $cli.DirectoryName) { throw "Core daemon and CLI runtime directories differ" }
          Remove-Item resources/core/* -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $daemon.DirectoryName '*') resources/core/ -Recurse -Force
          if (!(Test-Path resources/core/vargameshd.exe) -or !(Test-Path resources/core/vargamesh-cli.exe)) { throw "Core runtime copy failed" }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify source
        run: npm run check
      - name: Build
        run: npm run dist:win
      - name: SHA256
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $a = "dist/VargaMesh-Desktop-v$v-Windows-x64-Setup.exe"
          $b = "dist/VargaMesh-Desktop-v$v-Windows-x64-Portable.zip"
          if (!(Test-Path $a) -or !(Test-Path $b)) { throw "Artifacts missing" }
          @(
            "$( (Get-FileHash $a -Algorithm SHA256).Hash.ToLower() )  $(Split-Path $a -Leaf)",
            "$( (Get-FileHash $b -Algorithm SHA256).Hash.ToLower() )  $(Split-Path $b -Leaf)"
          ) | Set-Content dist/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: VargaMesh-Desktop-Windows-x64
          path: |
            dist/*Setup.exe
            dist/*Portable.zip
            dist/SHA256SUMS
      - name: Release tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$v") { throw "Tag/version mismatch" }
          gh release create "$env:GITHUB_REF_NAME" "dist/VargaMesh-Desktop-v$v-Windows-x64-Setup.exe" "dist/VargaMesh-Desktop-v$v-Windows-x64-Portable.zip" "dist/SHA256SUMS" --title "VargaMesh Desktop v$v" --notes-file RELEASE-NOTES.md --verify-tag --latest
