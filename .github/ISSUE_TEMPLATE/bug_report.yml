name: Bug report
description: Report a reproducible VargaMesh Desktop problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve VargaMesh Desktop. Never include private keys, WIFs, wallet files/backups, wallet passwords or RPC cookie contents.
  - type: input
    id: desktop-version
    attributes:
      label: VargaMesh Desktop version
      placeholder: v0.3.2
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Setup installer
        - Portable ZIP
        - Development/source build
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant non-sensitive logs
      description: Remove all secrets and privacy-sensitive values before posting.
      render: text
